<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程管理 V3｜工作單→結案</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f3f5f1;color:#1f2a44}.top{background:#1f2a44;color:#fff;padding:16px}.top h1{margin:0;font-size:21px}.top small{opacity:.75}.wrap{max-width:1200px;margin:auto;padding:14px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{border:0;border-radius:9px;padding:11px 18px;background:#fff;font-weight:800}.tab.on{background:#1f2a44;color:#fff}.grid{display:grid;grid-template-columns:300px 1fr;gap:12px}.card{background:#fff;border:1px solid #d8ddd3;border-radius:12px;padding:13px}.search{width:100%;padding:11px;border:1px solid #ccd2c8;border-radius:8px;margin-bottom:8px}.case{padding:11px;border-bottom:1px solid #eee;cursor:pointer}.case.on{background:#eef1ea;border-radius:8px}.case b{display:block}.muted{font-size:12px;color:#747d70}.badge{display:inline-block;font-size:12px;padding:3px 7px;border-radius:999px;background:#e7efe9;color:#365c42}.head{display:flex;justify-content:space-between;gap:10px;align-items:start}.btn{border:0;border-radius:8px;padding:10px 13px;background:#1f2a44;color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#e8ece6;color:#1f2a44}.info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.field{background:#f7f8f5;border-radius:8px;padding:9px}.field span{display:block;font-size:11px;color:#788075}.section{border-top:1px solid #e2e6df;margin-top:14px;padding-top:14px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.formgrid .wide{grid-column:span 3}label{font-size:12px;font-weight:700}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd1c7;border-radius:8px;font-size:16px;background:#fff}textarea{min-height:82px;resize:vertical}.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.chip{border:1px solid #cbd1c7;background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer}.chip.on{background:#1f2a44;color:#fff}.workrows{display:grid;gap:7px}.workrow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;align-items:center}.log{border-left:3px solid #9da99b;padding:2px 0 12px 11px;margin-left:4px}.closegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.check{padding:10px;border:1px solid #dfe4dc;border-radius:9px}.summary{background:#eef1ea;border-radius:10px;padding:12px;margin-top:10px}.hidden{display:none}.notice{background:#fff5d8;border:1px solid #ead28c;border-radius:9px;padding:10px;margin-bottom:10px;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}.list{max-height:220px;overflow:auto}.info{grid-template-columns:1fr 1fr}.formgrid,.closegrid{grid-template-columns:1fr 1fr}.formgrid .wide{grid-column:span 2}.checks{grid-template-columns:1fr 1fr}.workrow{grid-template-columns:1fr 1fr}.workrow select:last-child{grid-column:span 2}}@media(max-width:460px){.wrap{padding:9px}.info,.formgrid,.closegrid,.checks{grid-template-columns:1fr}.formgrid .wide{grid-column:span 1}.workrow{grid-template-columns:1fr}.workrow select:last-child{grid-column:span 1}.head{display:block}.head .btn{margin-top:8px;width:100%}}</style></head><body><div class="top"><h1>工程管理系統 <small>V3 測試版</small></h1><small>核心：工作單 → 每日工程紀錄 → 結案管理。此頁使用示範資料，不放公司真實案件。</small></div><div class="wrap"><div class="tabs"><button class="tab on" onclick="showTab('work',this)">工作單</button><button class="tab" onclick="showTab('close',this)">結案管理</button></div><div class="notice">已依你 Excel 的實際欄位整理：工程名稱、工程負責人、外機、內機、排水、線型、風管、機器品牌型號，以及「日期＋備註」持續累積的工程紀錄。</div><div class="grid"><div class="card list"><input class="search" id="search" placeholder="搜尋工程名稱／人員／型號" oninput="filterCases()"><div id="cases"></div></div><div class="card"><div id="work"><div class="head"><div><h2 id="pname" style="margin:0"></h2><span class="badge" id="status"></span><div class="muted">一個案件＝一份完整工程履歷</div></div><button class="btn" onclick="showTab('close',document.querySelectorAll('.tab')[1])">前往結案管理 →</button></div><div class="info" id="info"></div><div class="section"><h3>今日工程紀錄</h3><div class="formgrid"><div><label>施工日期</label><input id="date" type="date"></div><div><label>案件狀態</label><select id="pstatus"><option>施工中</option><option>待配合</option><option>待收尾</option><option>待驗收</option><option>已完工</option></select></div><div><label>紀錄主管</label><select><option>目前登入主管</option><option>小白</option><option>子弘</option><option>大霖</option></select></div><div class="wide"><label>今日出工人員</label><div class="people"><button class="chip" onclick="this.classList.toggle('on')">小白</button><button class="chip" onclick="this.classList.toggle('on')">子弘</button><button class="chip" onclick="this.classList.toggle('on')">大霖</button><button class="chip" onclick="this.classList.toggle('on')">阿泰</button><button class="chip" onclick="this.classList.toggle('on')">麥可</button><button class="chip" onclick="this.classList.toggle('on')">峰哥</button></div></div><div class="wide"><label>今日工項／責任</label><div class="workrows"><div class="workrow"><select><option>銅管配置</option><option>排水配置</option><option>內機安裝</option><option>外機安裝</option><option>風管</option><option>線型出風口</option><option>配線／線控</option><option>試車</option></select><select><option>負責人：子弘</option><option>小白</option><option>大霖</option><option>阿泰</option></select><select><option>施工中</option><option>完成</option><option>待確認</option><option>需返工</option></select></div><div class="workrow"><select><option>排水配置</option><option>銅管配置</option><option>內機安裝</option><option>外機安裝</option><option>風管</option></select><select><option>負責人：小白</option><option>子弘</option><option>大霖</option></select><select><option>完成</option><option>施工中</option><option>待確認</option></select></div></div></div><div class="wide"><label>今日施工內容</label><textarea id="note" placeholder="例：3F 銅管、排水完成；4F 內機上機，線控位置確認。"></textarea></div><div class="wide"><label>異常／待處理／下次施工</label><textarea placeholder="例：4F 線型尺寸待設計確認；預計週五進場收尾。"></textarea></div></div><button class="btn" style="margin-top:9px" onclick="addLog()">儲存今日工程紀錄</button></div><div class="section"><h3>工程履歷</h3><div id="logs"></div></div></div><div id="close" class="hidden"><div class="head"><div><h2 style="margin:0">結案管理</h2><div class="muted" id="closeName"></div></div><button class="btn alt" onclick="showTab('work',document.querySelectorAll('.tab')[0])">← 回工作單</button></div><div class="section"><h3>① 結案條件</h3><div class="checks"><label class="check"><input type="checkbox" style="width:auto"> 工程已完工</label><label class="check"><input type="checkbox" style="width:auto"> 客戶已驗收</label><label class="check"><input type="checkbox" style="width:auto"> 工程紀錄確認</label><label class="check"><input type="checkbox" style="width:auto"> 工項責任確認</label></div></div><div class="section"><h3>② 工程金額／收款</h3><div class="closegrid"><div><label>工程總額</label><input id="amount" type="number" placeholder="0"></div><div><label>已收款</label><input id="paid" type="number" placeholder="0" oninput="calc()"></div><div><label>未收款</label><input id="unpaid" readonly placeholder="自動計算"></div></div></div><div class="section"><h3>③ 工程業績認列</h3><div class="closegrid"><div><label>歸屬半年</label><select><option>2026 下半年</option><option>2026 上半年</option></select></div><div><label>管理負責人</label><select><option>小白</option><option>子弘</option><option>大霖</option></select></div><div><label>認列工程業績</label><input id="revenue" type="number" placeholder="0"></div></div><div class="summary"><b>結案後：</b>此案件工程履歷、工項責任與認列業績形成結案快照；已進入半年結算的數字不直接回頭改，後續變更以調整紀錄處理。</div></div><div class="section"><h3>④ 結案備註</h3><textarea placeholder="保固、客戶交代、未收款原因、特殊獎金或其他結案說明"></textarea><button class="btn" style="margin-top:9px" onclick="alert('V3 測試：結案流程確認完成。正式版會先備份、寫入 Firebase 並鎖定結案快照。')">確認結案並鎖定</button></div></div></div></div></div><script>const demo=[{n:'示範｜商辦 VRV 工程',s:'施工中',e:'小白',o:'峰哥',i:'子弘',d:'小白',l:'—',f:'—',m:'VRV／多聯式',logs:[['9/9','裝機前置作業、洗洞、鐵架、電源、銅管'],['9/8','內機上機、排水配置']]},{n:'示範｜住宅吊隱工程',s:'待收尾',e:'子弘',o:'子弘',i:'阿泰',d:'子弘',l:'大霖',f:'—',m:'吊隱式 4 台',logs:[['9/7','銅管配置、排水配置'],['9/5','現場放樣']]},{n:'示範｜商空保養改造',s:'待驗收',e:'大霖',o:'小白',i:'大霖',d:'—',l:'子弘',f:'子弘',m:'吊隱 6 台',logs:[['9/6','風鼓保養、馬達更換'],['9/4','線型出口調整']]}];let cur=0;document.getElementById('date').value=new Date().toISOString().slice(0,10);function renderList(arr=demo){cases.innerHTML=arr.map((x,i)=>`<div class="case ${demo.indexOf(x)==cur?'on':''}" onclick="cur=${demo.indexOf(x)};render()"><b>${x.n}</b><span class="badge">${x.s}</span><div class="muted">工程負責：${x.e}｜紀錄 ${x.logs.length} 筆</div></div>`).join('')}function render(){let x=demo[cur];pname.textContent=x.n;status.textContent=x.s;pstatus.value=['施工中','待配合','待收尾','待驗收','已完工'].includes(x.s)?x.s:'施工中';info.innerHTML=[['工程負責人',x.e],['外機系統負責人',x.o],['內機系統負責人',x.i],['排水負責人',x.d],['線型負責人',x.l],['風管負責人',x.f],['機器品牌及型號',x.m],['工程紀錄',x.logs.length+' 筆']].map(a=>`<div class="field"><span>${a[0]}</span><b>${a[1]||'—'}</b></div>`).join('');logs.innerHTML=x.logs.map(a=>`<div class="log"><b>${a[0]}</b><br>${a[1]}</div>`).join('');closeName.textContent=x.n;renderList()}function addLog(){if(!note.value.trim()){alert('請填今日施工內容');return}let d=date.value?date.value.slice(5).replace('-','/'):'今天';demo[cur].logs.unshift([d,note.value.trim()]);demo[cur].s=pstatus.value;note.value='';render();alert('已加入工程履歷（V3 測試頁僅存在本頁，尚未寫入正式資料庫）')}function showTab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');work.classList.toggle('hidden',id!=='work');close.classList.toggle('hidden',id!=='close')}function filterCases(){let q=search.value.toLowerCase();renderList(demo.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))}function calc(){let a=+amount.value||0,p=+paid.value||0;unpaid.value=Math.max(0,a-p);if(!revenue.value)revenue.value=a}amount.addEventListener('input',calc);render();</script></body></html>
