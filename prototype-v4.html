<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程管理 V4.5</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f4f6f3;color:#1f2a44}.top{background:#1f2a44;color:#fff;padding:16px}.wrap{max-width:1250px;margin:auto;padding:14px}.tabs,.actions,.checks{display:flex;gap:7px;flex-wrap:wrap}.tab,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.tab{background:#fff}.tab.on,.btn{background:#1f2a44;color:#fff}.green{background:#42634b}.card{background:#fff;border:1px solid #dfe3dc;border-radius:12px;padding:14px;margin-top:12px}.grid2,.grid3,.grid4{display:grid;gap:9px;margin:10px 0}.grid2{grid-template-columns:1fr 2fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd2c8;border-radius:8px;font-size:15px}textarea{min-height:80px}.hidden{display:none}.callout,.summary{padding:12px;border-radius:10px;background:#f6f8f5;margin:10px 0}.callout{border:1px solid #d8dfd4}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px;border-bottom:1px solid #e5e8e2;text-align:left}.table th{background:#f6f8f5;font-size:12px}.scroll{overflow:auto}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;background:#e5f2e8;color:#28603a}.workrow,.salesrow{display:grid;grid-template-columns:1.2fr 1fr 1fr 44px;gap:7px;margin:7px 0}.remove{border:0;border-radius:8px;background:#f4e2e2;color:#8a2929;font-weight:900}.money{font-size:20px;font-weight:900}.muted{font-size:12px;color:#727b70}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.person{display:inline-flex;align-items:center;gap:5px;padding:8px 10px;background:#fff;border:1px solid #cbd2c8;border-radius:8px}.person input{width:auto}.upload{border:1px dashed #aeb8aa;border-radius:10px;padding:12px;background:#fafbf9}.caseList{display:grid;gap:9px}.caseRow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;padding:12px;border:1px solid #dfe3dc;border-radius:10px;background:#fafbf9}@media(max-width:760px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}.workrow,.salesrow,.caseRow{grid-template-columns:1fr 1fr}}@media(max-width:460px){.grid2,.grid3,.grid4,.workrow,.salesrow,.caseRow{grid-template-columns:1fr}}</style></head><body><div class="top"><b style="font-size:21px">工程管理系統 V4.5 測試</b><div style="font-size:12px;opacity:.8">施工追蹤 → 工作單 → 結案管理 → 內外機台數統計</div></div><div class="wrap"><div class="tabs"><button class="tab on" onclick="go('track',this)">施工追蹤</button><button class="tab" onclick="go('work',this)">工作單</button><button class="tab" onclick="go('close',this)">結案管理</button><button class="tab" onclick="go('units',this)">內外機台數</button></div><section id="track"><div class="card"><div class="headrow"><h2>施工追蹤</h2><button class="btn green" onclick="addTrack.classList.toggle('hidden')">＋ 新增施工安排</button></div><div id="addTrack" class="callout hidden"><div class="grid4"><div><label>施工日期</label><input id="tDate" type="date" value="2026-09-10"></div><div><label>案件</label><select id="tCase"><option>A案件</option><option>B案件</option></select></div><div><label>負責主管</label><select id="tManager"></select></div><div><label>預定施工內容</label><input id="tWork" placeholder="配管、裝機、收尾"></div></div><label>預定出工人員｜選單可複選</label><div id="trackCrew" class="checks"></div><div class="grid2"><div><label>狀態</label><select id="tStatus"><option>待施工</option><option>施工中</option><option>待配合</option><option>待收尾</option></select></div><div><label>備註</label><input id="tNote"></div></div><button class="btn green" onclick="addTrackRow()">儲存施工安排</button></div><div class="scroll"><table class="table"><thead><tr><th>施工日期</th><th>案件</th><th>施工內容</th><th>主管</th><th>出工人員</th><th>回報</th><th>狀態</th><th></th></tr></thead><tbody id="trackBody"><tr><td>2026/09/09</td><td>A案件</td><td>配管／電源</td><td>小白</td><td>小白、子弘、阿泰</td><td><span class="badge">已填</span></td><td>施工中</td><td><button class="btn" onclick="go('work',document.querySelectorAll('.tab')[1])">工作單</button></td></tr></tbody></table></div></div></section><section id="work" class="hidden"><div class="card"><h2>工作單｜A案件</h2><div class="grid4"><div><label>施工日期</label><input type="date" value="2026-09-09"></div><div><label>工作管理員</label><select id="workManager"></select></div><div><label>案件狀態</label><select><option>施工中</option><option>待收尾</option><option>待驗收</option><option>已完工</option></select></div><div><label>品牌／型號</label><input value="示範機型"></div></div><h3>內外機系統</h3><div class="grid4"><div><label>內機數量</label><input type="number" value="12"></div><div><label>內機系統負責人</label><select id="indoorOwner"></select></div><div><label>外機數量</label><input type="number" value="4"></div><div><label>外機系統負責人</label><select id="outdoorOwner"></select></div></div><h3>工項責任</h3><div id="workRows"></div><button class="btn green" onclick="addWork()">＋ 新增工項責任</button><h3>今日工程紀錄</h3><div class="callout"><div class="grid3"><div><label>日期</label><input id="logDate" type="date" value="2026-09-09"></div><div style="grid-column:span 2"><label>出工人員｜選單可複選</label><div id="dailyCrew" class="checks"></div></div></div><label>工程工作紀錄</label><textarea id="logWork" placeholder="輸入今天實際完成的工程內容"></textarea><div class="grid2"><div><label>工程備註</label><textarea id="logNote" placeholder="異常、待處理、下次施工事項"></textarea></div><div><label>工程備註上傳</label><div class="upload"><input id="logFiles" type="file" multiple accept="image/*,.pdf" onchange="showFiles()"><div class="muted">可附現場照片、工程照片或 PDF</div><div id="fileNames" class="muted">尚未選擇檔案</div></div></div></div><button class="btn green" onclick="saveLog()">＋ 新增工程紀錄</button></div><div id="logHistory"></div><h3>業務人員／業績獎金</h3><div id="salesRows"></div><button class="btn green" onclick="addSales()">＋ 新增業務人員</button><div class="summary">業務業績：<b id="salesTotal">$0</b> ｜ 業務獎金：<b id="salesBonus">$0</b></div></div></section><section id="close" class="hidden"><div class="card"><div class="headrow"><div><h2>結案管理｜案件列表</h2><div class="muted">每個案件自己的業績績效基數與管理員 % 數分開設定</div></div><button class="btn green" onclick="addCloseCase()">＋ 新增案件</button></div><div class="grid3"><div><label>半年期間</label><select><option>2026 H2｜7/1–12/31</option><option>2026 H1｜1/1–6/30</option></select></div><div><label>狀態</label><select><option>全部案件</option><option>待結案</option><option>已結案</option></select></div><div><label>工作管理員</label><select><option>全部人員</option><option>小白</option><option>子弘</option><option>大霖</option></select></div></div><div id="closeCases" class="caseList"></div><div class="summary">半年管理員獎金合計：<span class="money" id="halfManagerTotal">$0</span></div></div></section><section id="units" class="hidden"><div class="card"><h2>內外機台數統計</h2><div class="callout"><b>只統計台數，不計算季獎金。</b></div><div class="grid3"><div><label>統計期間</label><select><option>2026 Q3｜7/1–9/30</option><option>2026 Q2｜4/1–6/30</option></select></div><div><label>人員</label><select><option>全部人員</option><option>子弘</option><option>小白</option></select></div><div><label>依據</label><input readonly value="結案日期"></div></div></div></section></div><script>const people=['小白','子弘','大霖','阿泰','峰哥'];const items=['銅管配置','排水配置','內機安裝','外機安裝','風管','線型出風口','配線／線控','試車驗收','其他'];function opts(a){return a.map(x=>'<option>'+x+'</option>').join('')}function crewBox(id){document.getElementById(id).innerHTML=people.map(x=>'<label class="person"><input type="checkbox" value="'+x+'"> '+x+'</label>').join('')}function selectedCrew(id){let a=[...document.querySelectorAll('#'+id+' input:checked')].map(x=>x.value);return a.length?a.join('、'):'未指定'}function go(id,b){['track','work','close','units'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on')}function addTrackRow(){if(!tDate.value||!tWork.value.trim())return alert('請填施工日期與施工內容');let tr=document.createElement('tr');tr.innerHTML='<td>'+tDate.value.replaceAll('-','/')+'</td><td>'+tCase.value+'</td><td>'+tWork.value+'</td><td>'+tManager.value+'</td><td>'+selectedCrew('trackCrew')+'</td><td><span class="badge">未填</span></td><td>'+tStatus.value+'</td><td><button class="btn" onclick="go(\'work\',document.querySelectorAll(\'.tab\')[1])">工作單</button></td>';trackBody.prepend(tr);addTrack.classList.add('hidden')}function addWork(){let d=document.createElement('div');d.className='workrow';d.innerHTML='<select>'+opts(items)+'</select><select>'+opts(people)+'</select><select><option>施工中</option><option>完成</option><option>待確認</option><option>需返工</option></select><button class="remove" onclick="this.parentElement.remove()">×</button>';workRows.appendChild(d)}function addSales(){let d=document.createElement('div');d.className='salesrow';d.innerHTML='<select>'+opts(people)+'</select><input class="rev" type="number" placeholder="業績認列" oninput="salesCalc()"><input class="spct" type="number" placeholder="獎金 %" oninput="salesCalc()"><button class="remove" onclick="this.parentElement.remove();salesCalc()">×</button>';salesRows.appendChild(d)}function salesCalc(){let r=0,b=0;document.querySelectorAll('.salesrow').forEach(x=>{let a=+x.querySelector('.rev').value||0,p=+x.querySelector('.spct').value||0;r+=a;b+=a*p/100});salesTotal.textContent='$'+Math.round(r).toLocaleString();salesBonus.textContent='$'+Math.round(b).toLocaleString()}function showFiles(){fileNames.textContent=logFiles.files.length?[...logFiles.files].map(x=>x.name).join('、'):'尚未選擇檔案'}function saveLog(){if(!logDate.value||!logWork.value.trim())return alert('請填日期與工程工作紀錄');let d=document.createElement('div');d.className='summary';d.innerHTML='<b>'+logDate.value.replaceAll('-','/')+'</b>｜'+selectedCrew('dailyCrew')+'<br>'+logWork.value+'<div class="muted">備註：'+(logNote.value||'無')+(logFiles.files.length?'｜附件 '+logFiles.files.length+' 個':'')+'</div>';logHistory.prepend(d);logWork.value='';logNote.value='';logFiles.value='';showFiles()}function addCloseCase(name='新案件',base=0,pct=0,manager='小白',date=''){let d=document.createElement('div');d.className='caseRow';d.innerHTML='<div><label>案件</label><input class="cname" value="'+name+'"></div><div><label>結案日期</label><input class="cdate" type="date" value="'+date+'"></div><div><label>工作管理員</label><select class="cmanager">'+opts(people)+'</select></div><div><label>業績績效基數</label><input class="cbase" type="number" value="'+base+'" oninput="closeCalc()"></div><div><label>本案件 %</label><input class="cpct" type="number" min="0" max="10" step="0.5" value="'+pct+'" oninput="closeCalc()"></div><div><label>管理員獎金</label><b class="cbonus money">$0</b></div>';closeCases.appendChild(d);d.querySelector('.cmanager').value=manager;closeCalc()}function closeCalc(){let total=0;document.querySelectorAll('.caseRow').forEach(r=>{let p=Math.min(10,Math.max(0,+r.querySelector('.cpct').value||0));r.querySelector('.cpct').value=p;let b=(+r.querySelector('.cbase').value||0)*p/100;r.querySelector('.cbonus').textContent='$'+Math.round(b).toLocaleString();total+=b});halfManagerTotal.textContent='$'+Math.round(total).toLocaleString()}['tManager','workManager','indoorOwner','outdoorOwner'].forEach(id=>document.getElementById(id).innerHTML=opts(people));crewBox('trackCrew');crewBox('dailyCrew');addWork();addSales();addCloseCase('A案件',300000,8,'小白','2026-09-20');addCloseCase('B案件',500000,6,'子弘','2026-09-25');</script></body></html>
