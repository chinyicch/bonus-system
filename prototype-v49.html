<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程管理 V4.9 設備責任列測試</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f4f6f3;color:#1f2a44}.top{background:#1f2a44;color:#fff;padding:16px}.wrap{max-width:1280px;margin:auto;padding:14px}.tabs,.checks{display:flex;gap:7px;flex-wrap:wrap}.tab,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.tab{background:#fff}.tab.on,.btn{background:#1f2a44;color:#fff}.green{background:#42634b}.red{background:#8a2929}.small{padding:7px 9px;font-size:12px}.card{background:#fff;border:1px solid #dfe3dc;border-radius:12px;padding:14px;margin-top:12px}.grid2,.grid3{display:grid;gap:9px;margin:10px 0}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd2c8;border-radius:8px;font-size:15px}textarea{min-height:82px}.hidden{display:none}.callout,.summary{padding:12px;border-radius:10px;background:#f6f8f5;margin:10px 0}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:9px;border-bottom:1px solid #e5e8e2;text-align:left}.table th{background:#f6f8f5;font-size:12px}.scroll{overflow:auto}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;background:#e5f2e8;color:#28603a}.warn{background:#fff0d6;color:#8a5a00}.muted{font-size:12px;color:#727b70}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.person{display:inline-flex;align-items:center;gap:5px;padding:8px 10px;background:#fff;border:1px solid #cbd2c8;border-radius:8px}.person input{width:auto}.upload{border:1px dashed #aeb8aa;border-radius:10px;padding:12px;background:#fafbf9}.stat{font-size:24px;font-weight:900}.bonusgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{border:1px solid #dfe3dc;border-radius:10px;padding:12px;background:#fafbf9}.money{font-weight:900}.equip select,.equip input{min-width:105px}@media(max-width:760px){.grid2,.grid3,.bonusgrid{grid-template-columns:1fr 1fr}}@media(max-width:460px){.grid2,.grid3,.bonusgrid{grid-template-columns:1fr}}</style></head><body><div class="top"><b style="font-size:21px">工程管理系統 V4.9｜設備責任列測試</b><div style="font-size:12px;opacity:.82">施工追蹤 → 工作單 → 結案管理 → 半年工程獎金 → 內外機台數</div></div><div class="wrap"><div class="tabs"><button class="tab on" onclick="go('track',this)">施工追蹤</button><button class="tab" onclick="go('work',this)">工作單</button><button class="tab" onclick="go('close',this)">結案管理</button><button class="tab" onclick="go('bonus',this)">半年工程獎金</button><button class="tab" onclick="go('units',this)">內外機台數</button></div><section id="track"><div class="card"><h2>施工追蹤｜Excel 前五個案件</h2><div class="scroll"><table class="table"><thead><tr><th>案件</th><th>工程管理人</th><th>最後進場</th><th>最近工作內容</th><th>設備數</th><th>狀態</th><th></th></tr></thead><tbody id="projectBody"></tbody></table></div></div></section><section id="work" class="hidden"><div class="card"><h2 id="workTitle">工作單</h2><div class="grid3"><div><label>案件</label><select id="caseSelect" onchange="loadProject(this.value)"></select></div><div><label>工程管理人</label><input id="wManager" readonly></div><div><label>案件狀態</label><select id="wStatus" onchange="setStatus(this.value)"><option>施工中</option><option>待收尾</option><option>已完工</option></select></div></div><div class="headrow"><div><h3>設備明細｜一台一列</h3><div class="muted">設備號碼｜品牌｜型號｜內機｜外機｜排水｜風管</div></div><button class="btn green" onclick="addEquipment()">＋ 新增設備</button></div><div class="scroll"><table class="table equip"><thead><tr><th>設備號碼</th><th>品牌</th><th>型號</th><th>內機</th><th>外機</th><th>排水</th><th>風管</th><th></th></tr></thead><tbody id="equipmentBody"></tbody></table></div><h3>每次進場工程紀錄</h3><div id="logHistory"></div><div class="callout"><div class="grid2"><div><label>進場日期</label><input id="logDate" type="date" value="2026-09-09"></div><div><div class="headrow"><label>出工人員｜可複選</label><button class="btn green small" onclick="addPerson()">＋ 新增人員</button></div><div id="dailyCrew" class="checks"></div></div></div><label>工程工作紀錄</label><textarea id="logWork"></textarea><div class="grid2"><div><label>工程備註</label><textarea id="logNote"></textarea></div><div><label>附件</label><div class="upload"><input id="logFiles" type="file" multiple accept="image/*,.pdf"></div></div></div><button class="btn green" onclick="saveLog()">＋ 新增本次進場紀錄</button></div><button class="btn" onclick="markDone()">標記工程已完工 → 送入待結案</button></div></section><section id="close" class="hidden"><div class="card"><h2>結案管理</h2><div class="scroll"><table class="table"><thead><tr><th>案件</th><th>管理人</th><th>完工日</th><th>工程績效</th><th>本案 %</th><th>工程獎金</th><th></th></tr></thead><tbody id="closeBody"></tbody></table></div></div></section><section id="bonus" class="hidden"><div class="card"><h2>半年工程獎金｜4–9月／10–3月</h2><div class="bonusgrid"><div class="box">業績<div class="stat" id="totalPerf">$0</div></div><div class="box">獎金<div class="stat" id="totalBonus">$0</div></div><div class="box">結案<div class="stat" id="closedCount">0 案</div></div><div class="box">管理人<div class="stat" id="managerCount">0 人</div></div></div><div class="scroll"><table class="table"><thead><tr><th>管理人</th><th>案件數</th><th>工程業績</th><th>工程獎金</th><th>案件明細</th></tr></thead><tbody id="bonusBody"></tbody></table></div></div></section><section id="units" class="hidden"><div class="card"><h2>內外機台數統計</h2><div class="scroll"><table class="table"><thead><tr><th>人員</th><th>內機</th><th>外機</th><th>來源案件</th></tr></thead><tbody id="unitBody"></tbody></table></div></div></section></div><script>let people=['小白','子弘','大霖','阿泰','峰哥','傑哥'];const brands=['待確認','日立','大金','Panasonic','三菱重工','華菱','海爾','米多力','其他'];const projects=[{id:'p1',name:'明志科大薄膜區',manager:'小白',status:'施工中',logs:[{date:'2026-09-09',work:'裝機前置作業.洗洞+鐵架+電源+銅管'}],equipment:[{brand:'日立',model:'RAC-22VP',indoor:'大霖',outdoor:'小白',drain:'小白',duct:'小白'}]},{id:'p2',name:'竹北市博愛路181號',manager:'小白',status:'施工中',logs:[{date:'2026-08-31',work:'吊內機+鐵架安裝'},{date:'2026-09-01',work:'鐵架安裝+上外機+銅管配置'},{date:'2026-09-02',work:'系統連接+線控配置'}],equipment:[]},{id:'p3',name:'永平街55號8樓',manager:'子弘',status:'施工中',logs:[{date:'2026-08-31',work:'裝機'}],equipment:[]},{id:'p4',name:'李董 松柏街70巷20號2樓',manager:'子弘',status:'施工中',logs:[{date:'2026-08-29',work:'裝舊機1組 保養一組'}],equipment:[]},{id:'p5',name:'重新路三段47巷5弄4號2樓',manager:'子弘',status:'施工中',logs:[{date:'2026-08-29',work:'裝機'}],equipment:[]}];let current='p1',closed=[];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function pnow(){return projects.find(x=>x.id===current)}function opts(a,v){return a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}function personOpts(v){return opts(['待確認',...people],v)}function go(id,b){['track','work','close','bonus','units'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');if(id==='close')renderClose();if(id==='bonus')renderBonus();if(id==='units')renderUnits()}function renderTrack(){$('projectBody').innerHTML=projects.map(p=>{let l=p.logs.at(-1)||{};return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.manager)}</td><td>${l.date||'-'}</td><td>${esc(l.work||'')}</td><td>${p.equipment.length} 台</td><td><span class="badge ${p.status==='已完工'?'':'warn'}">${p.status}</span></td><td><button class="btn" onclick="openWork('${p.id}')">開啟工作單</button></td></tr>`}).join('')}function openWork(id){current=id;$('caseSelect').value=id;loadProject(id);go('work',document.querySelectorAll('.tab')[1])}function loadProject(id){current=id;let p=pnow();$('workTitle').textContent='工作單｜'+p.name;$('wManager').value=p.manager;$('wStatus').value=p.status;renderEquipment();renderLogs();renderCrew()}function renderEquipment(){let p=pnow();$('equipmentBody').innerHTML=p.equipment.length?p.equipment.map((e,i)=>`<tr><td><b>${i+1}</b></td><td><select onchange="editEq(${i},'brand',this.value)">${opts(brands,e.brand)}</select></td><td><input value="${esc(e.model)}" placeholder="例 RAC-22VP" onchange="editEq(${i},'model',this.value)"></td><td><select onchange="editEq(${i},'indoor',this.value)">${personOpts(e.indoor)}</select></td><td><select onchange="editEq(${i},'outdoor',this.value)">${personOpts(e.outdoor)}</select></td><td><select onchange="editEq(${i},'drain',this.value)">${personOpts(e.drain)}</select></td><td><select onchange="editEq(${i},'duct',this.value)">${personOpts(e.duct)}</select></td><td><button class="btn red small" onclick="removeEq(${i})">刪除</button></td></tr>`).join(''):'<tr><td colspan="8" class="muted">尚無設備，按「＋新增設備」建立第 1 台。</td></tr>'}function addEquipment(){pnow().equipment.push({brand:'待確認',model:'',indoor:'待確認',outdoor:'待確認',drain:'待確認',duct:'待確認'});renderEquipment();renderTrack();renderUnits()}function editEq(i,k,v){pnow().equipment[i][k]=v;renderUnits()}function removeEq(i){pnow().equipment.splice(i,1);renderEquipment();renderTrack();renderUnits()}function addPerson(){let n=prompt('輸入新增人員姓名');if(!n)return;n=n.trim();if(!n||people.includes(n))return;people.push(n);renderCrew();renderEquipment()}function renderCrew(){$('dailyCrew').innerHTML=people.map(x=>`<label class="person"><input type="checkbox" value="${esc(x)}"> ${esc(x)}</label>`).join('')}function renderLogs(){$('logHistory').innerHTML=pnow().logs.slice().reverse().map(x=>`<div class="summary"><b>${x.date}</b><br>${esc(x.work)}${x.crew?`<div class="muted">出工：${esc(x.crew)}</div>`:''}${x.note?`<div class="muted">備註：${esc(x.note)}</div>`:''}</div>`).join('')}function saveLog(){if(!$('logDate').value||!$('logWork').value.trim())return alert('請填日期與工作紀錄');let crew=[...$('dailyCrew').querySelectorAll('input:checked')].map(x=>x.value).join('、');pnow().logs.push({date:$('logDate').value,work:$('logWork').value.trim(),note:$('logNote').value.trim(),crew});$('logWork').value='';$('logNote').value='';renderLogs();renderTrack()}function setStatus(v){pnow().status=v;renderTrack()}function markDone(){pnow().status='已完工';pnow().doneDate=new Date().toISOString().slice(0,10);$('wStatus').value='已完工';renderTrack();alert('已送入待結案')}function renderClose(){let a=projects.filter(p=>p.status==='已完工');$('closeBody').innerHTML=a.length?a.map(p=>{let c=closed.find(x=>x.id===p.id);return `<tr data-id="${p.id}"><td>${esc(p.name)}</td><td>${esc(p.manager)}</td><td>${p.doneDate||''}</td><td><input class="perf" type="number" ${c?'disabled':''} value="${c?.perf||''}"></td><td><input class="pct" type="number" min="0" max="10" ${c?'disabled':''} value="${c?.pct||''}"></td><td>${c?'$'+c.bonus.toLocaleString():'待計算'}</td><td>${c?'已結案':`<button class="btn green" onclick="finishClose(this)">確認結案</button>`}</td></tr>`}).join(''):'<tr><td colspan="7">目前沒有待結案案件</td></tr>'}function finishClose(b){let r=b.closest('tr'),p=projects.find(x=>x.id===r.dataset.id),perf=+r.querySelector('.perf').value,pct=+r.querySelector('.pct').value;if(!perf||pct<0||pct>10)return alert('請確認績效與 0–10%');closed.push({id:p.id,name:p.name,manager:p.manager,perf,pct,bonus:Math.round(perf*pct/100)});renderClose();renderBonus()}function renderBonus(){let g={};closed.forEach(x=>{g[x.manager]??={n:0,p:0,b:0,c:[]};g[x.manager].n++;g[x.manager].p+=x.perf;g[x.manager].b+=x.bonus;g[x.manager].c.push(x.name)});$('totalPerf').textContent='$'+closed.reduce((s,x)=>s+x.perf,0).toLocaleString();$('totalBonus').textContent='$'+closed.reduce((s,x)=>s+x.bonus,0).toLocaleString();$('closedCount').textContent=closed.length+' 案';$('managerCount').textContent=Object.keys(g).length+' 人';$('bonusBody').innerHTML=Object.entries(g).map(([n,x])=>`<tr><td>${esc(n)}</td><td>${x.n}</td><td>$${x.p.toLocaleString()}</td><td>$${x.b.toLocaleString()}</td><td>${x.c.map(esc).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="5">尚無資料</td></tr>'}function renderUnits(){let g={};projects.forEach(p=>p.equipment.forEach(e=>{[['indoor','i'],['outdoor','o']].forEach(([k,t])=>{let n=e[k];if(!n||n==='待確認')return;g[n]??={i:0,o:0,c:new Set};g[n][t]++;g[n].c.add(p.name)})}));$('unitBody').innerHTML=Object.entries(g).map(([n,x])=>`<tr><td>${esc(n)}</td><td>${x.i}</td><td>${x.o}</td><td>${[...x.c].map(esc).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="4">尚無資料</td></tr>'}$('caseSelect').innerHTML=projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');renderTrack();loadProject('p1');renderUnits();</script></body></html>
