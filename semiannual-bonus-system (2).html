<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>半年工程獎金核算表</title>
<style>

  :root{
    --paper:#EEF1EA; --ink:#1F2A44; --line:#CBCFC2;
    --stamp:#A63D2E; --gold:#8E7126; --pine:#3F6D4E; --muted:#5B6358;
    --serif:'Noto Serif TC', serif; --sans:'Noto Sans TC', sans-serif; --mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:#DDE1D6; font-family:var(--sans); color:var(--ink);}
  #app{max-width:1040px; margin:24px auto; background:var(--paper); border-radius:8px; overflow:hidden; box-shadow:0 2px 14px rgba(0,0,0,.12);}

  header{background:var(--ink); color:#F1EFE6; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  header h1{font-family:var(--serif); font-size:20px; font-weight:700; letter-spacing:1px; margin:0;}
  header p{font-size:12px; color:#B9C0AE; margin:2px 0 0;}
  header .actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  #saveState{font-family:var(--mono); font-size:11px; color:#9AA28C;}
  .hbtn{background:transparent; border:1px solid #4A5A78; color:#C7CDBB; border-radius:6px; padding:6px 10px; font-family:var(--sans); font-size:12px; cursor:pointer;}
  .hbtn:hover{background:#2A3A5C;}
  .hbtn.danger{border-color:#6A3A34; color:#E0AFA6;}

  #periodWrap{position:relative;}
  #periodBtn{display:flex; align-items:center; gap:6px; background:#2A3A5C; border:1px solid #4A5A78; color:#F1EFE6; border-radius:6px; padding:7px 12px; font-family:var(--serif); font-size:13px; font-weight:700; cursor:pointer;}
  #periodMenu{display:none; position:absolute; top:110%; right:0; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.18); min-width:240px; z-index:20; overflow:hidden;}
  #periodMenu.open{display:block;}
  #periodMenu .qitem{padding:9px 14px; font-family:var(--sans); font-size:13px; cursor:pointer; color:var(--ink);}
  #periodMenu .qitem:hover{background:#f3f5ef;}
  #periodMenu .qitem.current{background:var(--paper); font-weight:600;}
  #backupMenu{display:none; position:absolute; top:110%; right:0; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.18); min-width:280px; z-index:20; overflow:hidden;}
  #backupMenu.open{display:block;}
  #backupMenu .bitem{padding:9px 14px; font-family:var(--sans); font-size:12px; color:var(--muted); border-bottom:1px solid var(--line);}
  #backupMenu .bitem:last-child{border-bottom:none;}
  #backupMenu .bitem.clickable{cursor:pointer; color:var(--ink);}
  #backupMenu .bitem.clickable:hover{background:#f3f5ef;}
  #backupMenu .bsave{padding:10px 14px; font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer; color:var(--ink); border-bottom:1px solid var(--line); background:var(--paper);}
  #backupMenu .bsave:hover{background:#e4e7dc;}

  .layout{display:flex;}
  #tabs{width:150px; flex-shrink:0; background:#E4E7DC; border-right:1px solid var(--line); padding-top:10px;}
  .tab{cursor:pointer; position:relative; margin:4px 0 4px -1px; padding:10px 12px 10px 14px; border-radius:6px 0 0 6px; border:1px solid transparent;}
  .tab .bar{position:absolute; left:0; top:8px; bottom:8px; width:4px; border-radius:2px;}
  .tab .name{font-size:13px; font-weight:500; color:var(--muted); margin-left:6px;}
  .tab.active{background:var(--paper); border-color:var(--line);}
  .tab.active .name{color:var(--ink); font-weight:600;}

  main{flex:1; padding:24px; min-width:0;}

  .card{background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px;}
  .card h2{font-family:var(--serif); font-size:14px; font-weight:700; margin:0 0 10px; border-bottom:1px solid var(--line); padding-bottom:8px;}

  table{width:100%; border-collapse:collapse;}
  th{font-size:12px; color:var(--muted); text-align:left; padding:4px 6px; font-weight:500;}
  td{padding:6px; border-top:1px solid var(--line); font-size:13px;}

  select, input[type=number], input[type=text], input[type=date]{
    font-family:var(--mono); font-size:13px; font-weight:600; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:4px; padding:4px 6px;
  }
  input[type=text].plain{font-family:var(--sans); font-weight:400;}

  .stat{display:flex; justify-content:space-between; align-items:baseline; padding:6px 0;}
  .stat .label{font-size:13px; color:var(--muted);}
  .stat .value{font-family:var(--mono); font-size:15px; font-weight:600;}
  .stat.big .label{font-size:15px;}
  .stat.big .value{font-size:22px;}

  .addBtn{display:inline-flex; align-items:center; gap:4px; margin-top:8px; background:none; border:1px dashed var(--line); border-radius:6px; padding:6px 10px; font-family:var(--sans); font-size:12px; color:var(--muted); cursor:pointer;}
  .addBtn:hover{background:#f3f5ef;}
  .delBtn{background:none; border:none; cursor:pointer; color:var(--muted); font-size:14px;}
  .delBtn:hover{color:var(--stamp);}

  .rosterChip{display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:5px 6px 5px 12px; margin:0 8px 8px 0;}
  .rosterChip button{background:none; border:none; cursor:pointer; color:var(--muted); display:flex;}
  .rosterChip button:hover{color:var(--stamp);}

  .personChip{font-family:var(--sans); font-size:13px; padding:6px 14px; border-radius:20px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--muted); margin:0 8px 8px 0;}
  .personChip.active{color:#fff;}

  #summaryTable thead tr, .sumTable thead tr{background:var(--ink); color:#F1EFE6; font-size:12px; text-align:right;}
  .sumTable thead th{color:#F1EFE6; padding:8px 10px;}
  .sumTable thead th:first-child{text-align:left;}
  .sumTable td{text-align:right; font-family:var(--mono); font-size:13px;}
  .sumTable td:first-child{text-align:left; font-family:var(--sans); font-weight:600;}
  .sumFooter{border-top:2px solid var(--ink); text-align:right; font-family:var(--mono); font-size:15px; font-weight:700; padding:10px;}

  .statCardsRow{display:flex; gap:12px; flex-wrap:wrap;}
  .statCardsRow .box{flex:1; min-width:180px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px;}

  .projectCard{background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:14px; overflow:hidden;}
  .projectCardHead{background:var(--paper); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .projectCardHead .idx{font-family:var(--mono); font-size:12px; color:var(--muted); min-width:20px;}
  .projectCardHead input.pname{font-family:var(--serif); font-size:15px; font-weight:700; color:var(--ink); border:none; background:transparent; flex:1; min-width:200px;}
  .projectCardBody{padding:16px;}
  .fieldRow{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .fieldRow .fcol .flabel{font-family:var(--sans); font-size:11px; color:var(--muted); margin-bottom:3px;}
  .rolesBlock{border-top:1px solid var(--line); padding-top:12px;}
  .rolesBlock .rtitle{font-family:var(--sans); font-size:12px; color:var(--muted); margin-bottom:8px; font-weight:600;}
  .roleNameInput{font-family:var(--sans); font-size:13px; border:none; background:transparent; width:100%; color:var(--muted);}

  @media (max-width:640px){
    .layout{flex-direction:column;}
    #tabs{width:100%; display:flex; overflow-x:auto; padding:8px;}
    .tab{white-space:nowrap;}
  }
</style>
</head>

<div id="app">
  <header>
    <div>
      <h1>半年工程獎金核算表</h1>
      <p>業績分紅・依日期自動歸屬半年期與年度</p>
    </div>
    <div class="actions">
      <div id="periodWrap">
        <button id="periodBtn"></button>
        <div id="periodMenu"></div>
      </div>
      <button class="hbtn" id="addPeriodBtn">＋ 新增下一期</button>
      <button class="hbtn danger" id="deletePeriodBtn" style="display:none;">✕ 刪除此期</button>
      <span id="saveState"></span>
      <div id="backupWrap" style="position:relative;">
        <button class="hbtn" id="backupBtn">💾 手動存檔 ▾</button>
        <div id="backupMenu"></div>
      </div>
      <button class="hbtn" id="resetBtn">清空本期</button>
    </div>
  </header>
  <div class="layout">
    <div id="tabs"></div>
    <main id="main"></main>
  </div>
</div>

function periodFromDate(d){
  const m = d.getMonth()+1; const y = d.getFullYear();
  if(m>=4 && m<=9) return `AS-${y}`;
  if(m>=10) return `OS-${y}`;
  return `OS-${y-1}`;
}
function periodLabel(id){
  const [type,yStr] = id.split("-"); const y = Number(yStr);
  if(type==="AS") return `${y} 年 4月～9月（${y+1} 年 1月結算）`;
  return `${y} 年 10月～${y+1} 年 3月（${y+1} 年 7月結算）`;
}
function periodShort(id){
  const [type,yStr] = id.split("-"); const y = Number(yStr);
  return type==="AS" ? `${y}年上半期(4-9月)` : `${y}年下半期(10-3月)`;
}
function nextPeriodId(id){
  const [type,yStr] = id.split("-"); const y = Number(yStr);
  return type==="AS" ? `OS-${y}` : `AS-${y+1}`;
}

function defaultData(){
  return JSON.parse(JSON.stringify(IMPORTED_SEED_DATA));
}
function newSlip(defaultPerson){
  const today = new Date();
  const iso = today.toISOString().slice(0,10);
  return { id:`${Date.now()}-${Math.random().toString(36).slice(2,7)}`, date: iso, projectName:"", person: defaultPerson || "", revenue:0, sharePercent:0, approver:"", note:"", roles: DEFAULT_ROLES.map(r=>({role:r, name:""})), models: [{model:"", qty:1}] };
}
function backfillSlip(s){
  return {
    ...s,
    projectName: s.projectName != null ? s.projectName : "",
    note: s.note != null ? s.note : "",
    roles: s.roles || DEFAULT_ROLES.map(r=>({role:r, name:""})),
    models: (s.models && s.models.length) ? s.models : [{model:"", qty:1}],
  };
}
function backfillData(d){
  const periods = {};
  Object.keys(d.periods).forEach(pid=>{
    periods[pid] = { slips: d.periods[pid].slips.map(backfillSlip) };
  });
  return { ...d, periods, approvers: d.approvers || [] };
}
function fmt(n){ return Math.round(n||0).toLocaleString("zh-TW"); }
function slipBonus(s){ return ((Number(s.revenue)||0) * (Number(s.sharePercent)||0)) / 100; }
function summarize(slips){
  const totalRevenue = slips.reduce((a,s)=>a+(Number(s.revenue)||0),0);
  const totalBonus = slips.reduce((a,s)=>a+slipBonus(s),0);
  const byPerson = {};
  slips.forEach(s=>{
    const key = s.person || "（未指定）";
    if(!byPerson[key]) byPerson[key] = {revenue:0, bonus:0, count:0};
    byPerson[key].revenue += Number(s.revenue)||0;
    byPerson[key].bonus += slipBonus(s);
    byPerson[key].count += 1;
  });
  return { totalRevenue, totalBonus, byPerson, count: slips.length };
}
function personColor(name, roster){
  const idx = roster.indexOf(name);
  return PALETTE[(idx>=0?idx:name.length) % PALETTE.length];
}
function escapeHtml(s){
  const d = document.createElement("div");
  d.innerText = s;
  return d.innerHTML;
}

// ====== 雲端 API 呼叫（跟進出貨系統同樣的 JSONP + text/plain POST 手法）======
let jsonpCounter = 0;
function jsonpRequest(params){
  return new Promise((resolve, reject) => {
    const cbName = "__bonusJsonpCb" + (jsonpCounter++);
    const script = document.createElement("script");
    const qs = Object.keys(params).map(k => `${encodeURIComponent(k)}=${encodeURIComponent(params[k])}`).join("&");
    window[cbName] = (data) => {
      resolve(data);
      delete window[cbName];
      script.remove();
    };
    script.onerror = () => {
      reject(new Error("script load failed"));
      delete window[cbName];
      script.remove();
    };
    script.src = `${API_URL}?${qs}&callback=${cbName}`;
    document.body.appendChild(script);
  });
}

// Writing via fetch() gets blocked by CORS when this file is opened directly
// (file://) or from some hosts. A classic, reliable workaround: submit a real
// HTML <form> into a hidden <iframe> — that's a normal page submission, not an
// XHR/fetch call, so the browser's CORS rules don't apply to it at all.
let syncIframe = null;
function ensureSyncIframe(){
  if(syncIframe) return syncIframe;
  syncIframe = document.createElement("iframe");
  syncIframe.name = "bonusSyncFrame";
  syncIframe.style.display = "none";
  document.body.appendChild(syncIframe);
  return syncIframe;
}

function postToAPI(payload){
  return new Promise((resolve) => {
    const iframe = ensureSyncIframe();
    const form = document.createElement("form");
    form.method = "POST";
    form.action = API_URL;
    form.target = iframe.name;
    form.style.display = "none";

    Object.keys(payload).forEach((key) => {
      const input = document.createElement("input");
      input.name = key;
      input.value = typeof payload[key] === "string" ? payload[key] : JSON.stringify(payload[key]);
      form.appendChild(input);
    });

    document.body.appendChild(form);

    const cleanupAndResolve = () => {
      iframe.removeEventListener("load", onLoad);
      form.remove();
      resolve({ success: true });
    };
    const onLoad = () => cleanupAndResolve();
    iframe.addEventListener("load", onLoad);
    // Safety net in case the iframe's load event doesn't fire for some reason.
    setTimeout(cleanupAndResolve, 4000);

    form.submit();
  });
}

async function fetchCloudState(){
  if(!API_URL) return { ok:false, reason:"no-url" };
  try{
    const result = await jsonpRequest({ action: "getState" });
    if(result && result.error) return { ok:false, reason: result.error };
    return { ok:true, state: result };
  }catch(err){
    return { ok:false, reason: err.message };
  }
}

async function pushCloudState(state){
  if(!API_URL) return { ok:false, reason:"no-url" };
  try{
    await postToAPI({ action: "saveState", state: JSON.stringify(state) });
    return { ok:true };
  }catch(err){
    return { ok:false, reason: err.message };
  }
}

function loadLocalFallback(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return backfillData(JSON.parse(raw));
  }catch(err){ /* fall through */ }
  return defaultData();
}

let data = null;
let cloudMode = false; // true once we've confirmed a working API_URL
let tab = 0; // 0 entry, 1 period summary, 2 annual, 3 person statement
let statementPerson = "";
let annualYear = null;
let periodMenuOpen = false;
let backupMenuOpen = false;
let backups = [];

async function initApp(){
  document.getElementById("main").innerHTML = `<div style="font-family:var(--sans); font-size:13px; color:var(--muted); padding:20px;">載入資料中…</div>`;
  backups = loadBackups();

  if(API_URL){
    const result = await fetchCloudState();
    if(result.ok){
      cloudMode = true;
      if(result.state){
        data = backfillData(result.state);
      } else {
        // Empty sheet (first time) — seed it with the local default/import data.
        data = defaultData();
        await pushCloudState(data);
      }
    } else {
      // Cloud configured but unreachable right now — fall back to local copy so the
      // person can keep working; it will try the cloud again on next page load.
      cloudMode = false;
      data = loadLocalFallback();
    }
  } else {
    data = loadLocalFallback();
  }

  render();

  const saveEl = document.getElementById("saveState");
  if(saveEl){
    if(cloudMode) saveEl.textContent = "已連上雲端";
    else if(API_URL) saveEl.textContent = "⚠ 雲端連線失敗（暫時僅本機）";
    else saveEl.textContent = "僅本機模式";
  }
}

function backupKey(i){ return `${STORAGE_KEY}-backup-${i}`; }
function loadBackups(){
  const arr = [];
  for(let i=1;i<=3;i++){
    try{
      const raw = localStorage.getItem(backupKey(i));
      arr.push(raw ? JSON.parse(raw) : null);
    }catch(err){ arr.push(null); }
  }
  return arr;
}
function saveBackup(){
  const snapshot = { timestamp: Date.now(), data: JSON.parse(JSON.stringify(data)) };
  backups = [snapshot, backups[0], backups[1]];
  for(let i=0;i<3;i++){
    try{
      if(backups[i]) localStorage.setItem(backupKey(i+1), JSON.stringify(backups[i]));
      else localStorage.removeItem(backupKey(i+1));
    }catch(err){ /* ignore individual slot failures */ }
  }
  backupMenuOpen = false;
  renderHeader();
}
function restoreBackup(idx){
  const b = backups[idx];
  if(!b) return;
  const when = new Date(b.timestamp).toLocaleString("zh-TW");
  if(!confirm(`確定要還原到「${when}」的備份嗎？目前畫面上的資料會被這份備份取代。`)) return;
  data = b.data;
  persist();
  backupMenuOpen = false;
  render();
}

let saveTimer = null;
function persist(){
  const el = document.getElementById("saveState");
  el.textContent = "儲存中…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    // Always keep a local cache as an offline safety net.
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(err){ /* ignore */ }

    if(cloudMode){
      const result = await pushCloudState(data);
      el.textContent = result.ok ? "已同步雲端" : "⚠ 雲端同步失敗（已存本機）";
    } else if(API_URL) {
      el.textContent = "⚠ 尚未連上雲端（僅存本機）";
    } else {
      el.textContent = "已自動儲存（僅本機）";
    }
  }, 300);
}

function currentSlips(){ return data.periods[data.current].slips; }

function render(){
  renderHeader();
  renderTabs();
  renderMain();
}

function renderHeader(){
  document.getElementById("periodBtn").textContent = periodShort(data.current) + " ▾";
  const menu = document.getElementById("periodMenu");
  menu.className = periodMenuOpen ? "open" : "";
  menu.innerHTML = [...data.order].reverse().map(id=>`
    <div class="qitem${id===data.current?" current":""}" data-period="${id}">${periodLabel(id)}</div>
  `).join("");
  menu.querySelectorAll("[data-period]").forEach(el=>{
    el.onclick = ()=>{ data.current = el.getAttribute("data-period"); periodMenuOpen=false; persist(); render(); };
  });
  document.getElementById("deletePeriodBtn").style.display = data.order.length > 1 ? "inline-flex" : "none";

  const backupMenu = document.getElementById("backupMenu");
  backupMenu.className = backupMenuOpen ? "open" : "";
  backupMenu.innerHTML = `
    <div class="bsave" id="doSaveBackupBtn">＋ 存一份新備份（存到第 1 格，其餘往後推）</div>
    ${[0,1,2].map(i=>{
      const b = backups[i];
      const label = b ? `第 ${i+1} 格：${new Date(b.timestamp).toLocaleString("zh-TW")}（點擊還原）` : `第 ${i+1} 格：（空）`;
      return `<div class="bitem${b?" clickable":""}" data-restore-backup="${i}">${label}</div>`;
    }).join("")}
  `;
  document.getElementById("doSaveBackupBtn").onclick = saveBackup;
  backupMenu.querySelectorAll("[data-restore-backup]").forEach(el=>{
    el.onclick = ()=>{ restoreBackup(Number(el.getAttribute("data-restore-backup"))); };
  });
}

function renderTabs(){
  const tabsEl = document.getElementById("tabs");
  const items = [
    { label:"獎金單登錄", color: PALETTE[0] },
    { label:"本期總表", color: PALETTE[1] },
    { label:"年度總表", color: PALETTE[2] },
    { label:"業務人員總表單", color: PALETTE[3] },
  ];
  tabsEl.innerHTML = "";
  items.forEach((t,i)=>{
    const div = document.createElement("div");
    div.className = "tab" + (tab===i ? " active" : "");
    div.innerHTML = `<div class="bar" style="background:${t.color}"></div><div class="name">${t.label}</div>`;
    div.onclick = ()=>{ tab=i; render(); };
    tabsEl.appendChild(div);
  });
}

function renderMain(){
  const main = document.getElementById("main");
  if(tab===0) main.innerHTML = entryHtml();
  else if(tab===1) main.innerHTML = periodSummaryHtml();
  else if(tab===2) main.innerHTML = annualSummaryHtml();
  else main.innerHTML = personStatementHtml();
  bindMainEvents();
}

              <td>${escapeHtml(s.approver) || "-"}</td>
              <td style="color:var(--muted);">${escapeHtml(s.note) || "-"}</td>
            </tr>`).join("")}
          </tbody>
          <tfoot>
            <tr style="border-top:2px solid var(--ink);">
              <td colspan="4" style="font-weight:700;">合計</td>
              <td style="text-align:right; font-family:var(--mono); font-weight:700; color:var(--gold);">${fmt(personPeriodSummary.totalBonus)}</td>
              <td></td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      `}
    </div>
  </div>` : ""}
  `;
}

function bindMainEvents(){
  document.getElementById("periodBtn").onclick = ()=>{ periodMenuOpen = !periodMenuOpen; renderHeader(); };

  if(tab === 0){
    document.querySelectorAll("[data-remove-person]").forEach(btn=>{
      btn.onclick = ()=>{
        const name = btn.getAttribute("data-remove-person");
        data.roster = data.roster.filter(n=>n!==name);
        persist(); renderMain();
      };
    });
    document.getElementById("addPersonBtn").onclick = ()=>{
      const input = document.getElementById("newPersonInput");
      const name = input.value.trim();
      if(!name || data.roster.includes(name)) return;
      data.roster.push(name);
      persist(); renderMain();
    };
    document.getElementById("newPersonInput").onkeydown = (ev)=>{
      if(ev.key === "Enter") document.getElementById("addPersonBtn").click();
    };
    document.querySelectorAll("[data-remove-slip]").forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.getAttribute("data-remove-slip");
        const slips = currentSlips().filter(s=>s.id!==id);
        data.periods[data.current] = { slips };
        persist(); renderMain();
      };
    });
    document.getElementById("addSlipBtn").onclick = ()=>{
      currentSlips().push(newSlip(data.roster[0] || ""));
      persist(); renderMain();
    };
    document.querySelectorAll("[data-field]").forEach(inp=>{
      const field = inp.getAttribute("data-field");
      const structural = field === "person" || field === "approver";
      inp.oninput = (ev)=>{
        const id = ev.target.getAttribute("data-id");
        const f = ev.target.getAttribute("data-field");
        const slip = currentSlips().find(s=>s.id===id);
        if(!slip) return;
        slip[f] = (f==="revenue"||f==="sharePercent") ? Number(ev.target.value) : ev.target.value;
        persist();
        patchEntryTotals(id);
      };
      if(structural){
        inp.onchange = (ev)=>{
          const id = ev.target.getAttribute("data-id");
          const f = ev.target.getAttribute("data-field");
          const slip = currentSlips().find(s=>s.id===id);
          if(!slip) return;
          slip[f] = ev.target.value;
          persist();
        };
      }
    });

    document.querySelectorAll("[data-model-field]").forEach(inp=>{
      inp.oninput = (ev)=>{
        const slipId = ev.target.getAttribute("data-slip-id");
        const modelIdx = Number(ev.target.getAttribute("data-model-idx"));
        const field = ev.target.getAttribute("data-model-field");
        const slip = currentSlips().find(s=>s.id===slipId);
        if(!slip) return;
        slip.models[modelIdx][field] = field === "qty" ? Number(ev.target.value) : ev.target.value;
        persist();
      };
    });
    document.querySelectorAll("[data-remove-model]").forEach(btn=>{
      btn.onclick = ()=>{
        const slipId = btn.getAttribute("data-slip-id");
        const modelIdx = Number(btn.getAttribute("data-remove-model"));
        const slip = currentSlips().find(s=>s.id===slipId);
        if(!slip) return;
        slip.models.splice(modelIdx, 1);
        if(slip.models.length === 0) slip.models.push({model:"", qty:1});
        persist(); renderMain();
      };
    });
    document.querySelectorAll("[data-add-model]").forEach(btn=>{
      btn.onclick = ()=>{
        const slipId = btn.getAttribute("data-add-model");
        const slip = currentSlips().find(s=>s.id===slipId);
        if(!slip) return;
        slip.models.push({model:"", qty:1});
        persist(); renderMain();
      };
    });

    document.querySelectorAll("[data-remove-approver]").forEach(btn=>{
      btn.onclick = ()=>{
        const name = btn.getAttribute("data-remove-approver");
        data.approvers = (data.approvers||[]).filter(n=>n!==name);
        persist(); renderMain();
      };
    });
    document.getElementById("addApproverBtn").onclick = ()=>{
      const input = document.getElementById("newApproverInput");
      const name = input.value.trim();
      if(!name || (data.approvers||[]).includes(name)) return;
      data.approvers = data.approvers || [];
      data.approvers.push(name);
      persist(); renderMain();
    };
    document.getElementById("newApproverInput").onkeydown = (ev)=>{
      if(ev.key === "Enter") document.getElementById("addApproverBtn").click();
    };

    document.querySelectorAll("[data-role-field]").forEach(inp=>{
      inp.oninput = (ev)=>{
        const slipId = ev.target.getAttribute("data-slip-id");
        const roleIdx = Number(ev.target.getAttribute("data-role-idx"));
        const field = ev.target.getAttribute("data-role-field");
        const slip = currentSlips().find(s=>s.id===slipId);
        if(!slip) return;
        slip.roles[roleIdx][field] = ev.target.value;
        persist();
      };
    });
    document.querySelectorAll("[data-remove-role]").forEach(btn=>{
      btn.onclick = ()=>{
        const slipId = btn.getAttribute("data-slip-id");
        const roleIdx = Number(btn.getAttribute("data-remove-role"));
        const slip = currentSlips().find(s=>s.id===slipId);
        if(!slip) return;
        slip.roles.splice(roleIdx, 1);
        persist(); renderMain();
      };
    });
    document.querySelectorAll("[data-add-role]").forEach(btn=>{
      btn.onclick = ()=>{
        const slipId = btn.getAttribute("data-add-role");
        const slip = currentSlips().find(s=>s.id===slipId);
        if(!slip) return;
        slip.roles.push({role:"新增管理人", name:""});
        persist(); renderMain();
      };
    });
  } else if(tab === 2){
    document.querySelectorAll("[data-fy]").forEach(btn=>{
      btn.onclick = ()=>{ annualYear = Number(btn.getAttribute("data-fy")); renderMain(); };
    });
  } else if(tab === 3){
    document.querySelectorAll("[data-person]").forEach(btn=>{
      btn.onclick = ()=>{ statementPerson = btn.getAttribute("data-person"); renderMain(); };
    });

    const activeFY = annualYear != null ? annualYear : fyYearOf(data.current);
    const fyPeriodIds = data.order.filter(id=>fyYearOf(id)===activeFY);
    const fySlips = fyPeriodIds.flatMap(id=>data.periods[id].slips);
    const allPeople = Array.from(new Set([...data.roster, ...currentSlips().map(s=>s.person).filter(Boolean)]));

    const exportOnePerson = async (name)=>{
      const pSlips = currentSlips().filter(s=>s.person===name);
      const pFYSlips = fySlips.filter(s=>s.person===name);
      const pSummary = summarize(pSlips);
      const pFYSummary = summarize(pFYSlips);
      const canvas = await drawPersonStatementCanvas(name, periodLabel(data.current), fyLabel(activeFY), pSummary, pFYSummary, pSlips);
      downloadCanvasAsPNG(canvas, `${name}-${periodLabel(data.current).replace(/[\s（）:：]/g,"")}-工程獎金總表單.png`);
    };

    const oneBtn = document.getElementById("exportOnePersonBtn");
    const allBtn = document.getElementById("exportAllPersonBtn");
    if(oneBtn){
      const setBusy = (busy)=>{
        oneBtn.disabled = busy; allBtn.disabled = busy;
        oneBtn.style.opacity = busy ? 0.6 : 1;
        allBtn.style.opacity = busy ? 0.6 : 1;
        allBtn.textContent = busy ? "匯出中…" : "⬇ 下載全部業務人員";
      };
      oneBtn.onclick = async ()=>{
        const activePerson = statementPerson || allPeople[0] || "";
        if(!activePerson) return;
        setBusy(true);
        try{ await exportOnePerson(activePerson); } finally { setBusy(false); }
      };
      allBtn.onclick = async ()=>{
        setBusy(true);
        try{
          for(const name of allPeople){
            await exportOnePerson(name);
            await new Promise(r=>setTimeout(r,250));
          }
        } finally { setBusy(false); }
      };
    }
  }
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function truncateText(str, n){
  const s = str || "-";
  return s.length > n ? s.slice(0, n-1) + "…" : s;
}

async function drawPersonStatementCanvas(personName, periodLabelStr, fyLabelStr, periodSummary, fySummary, periodSlips){
  try{ await document.fonts.ready; }catch(err){ /* ignore */ }

  const ink="#1F2A44", line="#CBCFC2", stampRed="#A63D2E", gold="#8E7126", pine="#3F6D4E", muted="#5B6358";
  const W = 760;
  const pad = 24;
  const headerH = 76;
  const statsH = 90;
  const sectionTitleH = 32;
  const tableHeaderH = 26;
  const rowH = 26;
  const tableFooterH = 30;
  const tableBodyH = periodSlips.length > 0 ? tableHeaderH + periodSlips.length*rowH + tableFooterH : 40;
  const H = headerH + pad + statsH + 20 + sectionTitleH + tableBodyH + pad;

  const dpr = 2;
  const canvas = document.createElement("canvas");
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr,dpr);

  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = ink;
  ctx.fillRect(0,0,W,headerH);
  ctx.fillStyle = "#F1EFE6";
  ctx.font = "700 20px 'Noto Serif TC', serif";
  ctx.textBaseline = "middle";
  ctx.fillText(`${personName} ・ 工程獎金總表單`, pad, headerH/2 - 6);
  ctx.font = "500 12px 'Noto Sans TC', sans-serif";
  ctx.fillStyle = "#B9C0AE";
  ctx.fillText(periodLabelStr, pad, headerH/2 + 16);

  let y = headerH + pad;
  const gap = 14;
  const boxW = (W - pad*2 - gap) / 2;
  const stats = [
    { k:`本期（${periodLabelStr}）`, v:`$ ${fmt(periodSummary.totalBonus)}`, sub:`業績 $ ${fmt(periodSummary.totalRevenue)} ・ ${periodSummary.count} 張獎金單`, color:gold },
    { k:fyLabelStr, v:`$ ${fmt(fySummary.totalBonus)}`, sub:`業績 $ ${fmt(fySummary.totalRevenue)} ・ ${fySummary.count} 張獎金單`, color:pine },
  ];
  stats.forEach((s,i)=>{
    const x = pad + i*(boxW+gap);
    ctx.strokeStyle = line; ctx.lineWidth = 1;
    roundRectPath(ctx, x, y, boxW, statsH, 8); ctx.stroke();
    ctx.fillStyle = muted; ctx.font = "500 12px 'Noto Sans TC', sans-serif";
    ctx.fillText(s.k, x+14, y+22);
    ctx.fillStyle = s.color; ctx.font = "600 22px 'IBM Plex Mono', monospace";
    ctx.fillText(s.v, x+14, y+50);
    ctx.fillStyle = muted; ctx.font = "400 11px 'Noto Sans TC', sans-serif";
    ctx.fillText(s.sub, x+14, y+72);
  });
  y += statsH + 20;

  ctx.strokeStyle = line;
  ctx.beginPath(); ctx.moveTo(pad, y+sectionTitleH-8); ctx.lineTo(W-pad, y+sectionTitleH-8); ctx.stroke();
  ctx.fillStyle = ink; ctx.font = "700 14px 'Noto Serif TC', serif";
  ctx.fillText("本期獎金單明細", pad, y+10);
  y += sectionTitleH;

  const cols = { name: pad, date: 190, revenue: 270, pct: 360, bonus: 420, approver: 500, note: 570 };

  if(periodSlips.length === 0){
    ctx.fillStyle = muted; ctx.font = "400 13px 'Noto Sans TC', sans-serif";
    ctx.fillText("本期無資料。", pad, y+20);
  } else {
    ctx.fillStyle = muted; ctx.font = "500 11px 'Noto Sans TC', sans-serif";
    ctx.fillText("工程名稱", cols.name, y+13);
    ctx.fillText("日期", cols.date, y+13);
    ctx.fillText("業績", cols.revenue, y+13);
    ctx.fillText("分紅%", cols.pct, y+13);
    ctx.fillText("獎金", cols.bonus, y+13);
    ctx.fillText("簽核", cols.approver, y+13);
    ctx.fillText("備註", cols.note, y+13);
    y += tableHeaderH;

    periodSlips.forEach(s=>{
      ctx.strokeStyle = line;
      ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke();
      ctx.fillStyle = ink; ctx.font = "400 12px 'Noto Sans TC', sans-serif";
      ctx.fillText(truncateText(s.projectName, 14), cols.name, y+16);
      ctx.font = "400 11px 'IBM Plex Mono', monospace";
      ctx.fillText(s.date, cols.date, y+16);
      ctx.fillText(fmt(s.revenue), cols.revenue, y+16);
      ctx.fillText(`${s.sharePercent}%`, cols.pct, y+16);
      ctx.fillStyle = gold; ctx.font = "500 11px 'IBM Plex Mono', monospace";
      ctx.fillText(fmt(slipBonus(s)), cols.bonus, y+16);
      ctx.fillStyle = ink; ctx.font = "400 11px 'Noto Sans TC', sans-serif";
      ctx.fillText(truncateText(s.approver, 8), cols.approver, y+16);
      ctx.fillText(truncateText(s.note, 12), cols.note, y+16);
      y += rowH;
    });

    ctx.strokeStyle = ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.fillStyle = ink; ctx.font = "700 12px 'Noto Sans TC', sans-serif";
    ctx.fillText("合計", pad, y+18);
    ctx.fillStyle = gold; ctx.font = "700 12px 'IBM Plex Mono', monospace";
    ctx.fillText(fmt(periodSummary.totalBonus), cols.bonus, y+18);
  }

  return canvas;
}

function downloadCanvasAsPNG(canvas, filename){
  canvas.toBlob((blob)=>{
    if(!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }, "image/png");
}

// Lightweight patch: update only this row's bonus cell + the period totals, without
// rebuilding the whole table (keeps focus in the input the person is typing in).
function patchEntryTotals(id){
  const slip = currentSlips().find(s=>s.id===id);
  if(slip){
    const cell = document.getElementById(`bonusCell-${id}`);
    if(cell) cell.textContent = `$ ${fmt(slipBonus(slip))}`;
  }
  const summary = summarize(currentSlips());
  const setText = (elId, text)=>{ const el = document.getElementById(elId); if(el) el.textContent = text; };
  setText("totalRevenueVal", `$ ${fmt(summary.totalRevenue)}`);
  setText("totalBonusVal", `$ ${fmt(summary.totalBonus)}`);
  setText("slipCountVal", String(summary.count));
}

document.getElementById("addPeriodBtn").onclick = ()=>{
  let newId = nextPeriodId(data.order[data.order.length-1]);
  while(data.periods[newId]) newId = nextPeriodId(newId);
  data.order.push(newId);
  data.periods[newId] = { slips: [] };
  data.current = newId;
  periodMenuOpen = false;
  persist(); render();
};

document.getElementById("deletePeriodBtn").onclick = ()=>{
  if(data.order.length <= 1) return;
  if(!confirm(`確定要刪除「${periodLabel(data.current)}」這個半年期的全部資料嗎？此動作無法復原。`)) return;
  data.order = data.order.filter(id => id !== data.current);
  delete data.periods[data.current];
  data.current = data.order[data.order.length-1];
  persist(); render();
};

document.getElementById("resetBtn").onclick = ()=>{
  if(confirm("確定要清空目前這個半年期的全部獎金單資料嗎？此動作無法復原。")){
    data.periods[data.current] = { slips: [] };
    persist(); render();
  }
};

document.getElementById("backupBtn").onclick = ()=>{ backupMenuOpen = !backupMenuOpen; renderHeader(); };

document.addEventListener("click", (ev)=>{
  const periodWrap = document.getElementById("periodWrap");
  if(periodMenuOpen && periodWrap && !periodWrap.contains(ev.target)){
    periodMenuOpen = false;
    renderHeader();
  }
  const backupWrap = document.getElementById("backupWrap");
  if(backupMenuOpen && backupWrap && !backupWrap.contains(ev.target)){
    backupMenuOpen = false;
    renderHeader();
  }
});

initApp();
